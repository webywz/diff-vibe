name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke the compiled CLI
        run: |
          node dist/cli.js --help
          node dist/cli.js --version
          test -x dist/cli.js
          head -n1 dist/cli.js | grep -qx '#!/usr/bin/env node'
      - name: Verify npm pack includes the bin
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/diff-vibe-pack.txt
          grep -E 'dist/cli\.js' /tmp/diff-vibe-pack.txt
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.bin['diff-vibe'] !== 'dist/cli.js') process.exit(1);
            if (pkg.publishConfig.access !== 'public') process.exit(1);
          "
          tarball=$(npm pack --silent)
          node -e "
            const { execFileSync } = require('child_process');
            const packed = JSON.parse(execFileSync('tar', ['-xOf', process.argv[1], 'package/package.json'], { encoding: 'utf8' }));
            if (packed.bin['diff-vibe'] !== 'dist/cli.js') process.exit(1);
          " "$tarball"
          rm -f "$tarball"
